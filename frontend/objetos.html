<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objetos — UNIP Achados e Perdidos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-layout">
    <main class="main-content">
      <div class="page-container">

        <!-- Top Header & Filter Controls -->
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Catálogo de Objetos</h3>
              <p class="card-subtitle">Consulte, filtre e gerencie os pertences cadastrados</p>
            </div>
            <button class="btn btn-accent" onclick="openObjectModal()">+ Registrar Objeto</button>
          </div>

          <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;">
            <input type="text" id="search-input" class="form-input" style="flex: 1; min-width: 200px;" placeholder="Pesquisar por nome, cor, marca, descrição...">
            <select id="status-filter" class="form-select" style="width: 180px;">
              <option value="todos">Todos os Status</option>
              <option value="Perdido">Perdidos</option>
              <option value="Encontrado">Encontrados</option>
              <option value="Devolvido">Devolvidos</option>
            </select>
          </div>
        </div>

        <!-- Objects Table -->
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Objeto</th>
                  <th>Status</th>
                  <th>Detalhes</th>
                  <th>Local</th>
                  <th>Contato</th>
                  <th style="text-align: right;">Ações</th>
                </tr>
              </thead>
              <tbody id="objects-table-body">
                <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Carregando objetos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal Cadastrar / Editar Objeto -->
  <div class="modal-overlay" id="modal-objeto">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-objeto-title">Registrar Novo Objeto</h3>
        <button class="modal-close" onclick="closeModal('modal-objeto')">&times;</button>
      </div>
      <form id="objeto-form">
        <div class="modal-body">
          <input type="hidden" id="obj-id">

          <div class="form-group">
            <label class="form-label" for="obj-nome">Nome do Objeto *</label>
            <input type="text" id="obj-nome" class="form-input" placeholder="Ex: Mochila, Chaveiro, Garrafa" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="obj-status">Status *</label>
              <select id="obj-status" class="form-select" required>
                <option value="Perdido">Perdido</option>
                <option value="Encontrado">Encontrado</option>
                <option value="Devolvido">Devolvido</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="obj-cor">Cor</label>
              <input type="text" id="obj-cor" class="form-input" placeholder="Ex: Preto, Azul">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="obj-marca">Marca</label>
              <input type="text" id="obj-marca" class="form-input" placeholder="Ex: Nike, Samsung">
            </div>

            <div class="form-group">
              <label class="form-label" for="obj-local">Local do Campus</label>
              <input type="text" id="obj-local" class="form-input" placeholder="Ex: Praça de Alimentação, Lab 3, Bloco A">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="obj-contato">Contato para Devolução</label>
            <input type="text" id="obj-contato" class="form-input" placeholder="Ex: Tel / WhatsApp / Email">
          </div>

          <div class="form-group">
            <label class="form-label" for="obj-descricao">Descrição Detalhada</label>
            <textarea id="obj-descricao" class="form-textarea" rows="3" placeholder="Detalhes como marcas de uso, chaveiro preso, etc."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-objeto')">Cancelar</button>
          <button type="submit" id="btn-save-obj" class="btn btn-primary">Salvar Objeto</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/objetos.js"></script>
</body>
</html>
