<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — UNIP Achados e Perdidos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Criar Nova Conta</h1>
      <p>Cadastre-se como Aluno para acessar o sistema</p>
    </div>

    <form id="cadastro-form">
      <div class="form-group">
        <label for="ra" class="form-label">Registro Acadêmico (RA)</label>
        <input type="text" id="ra" class="form-input" placeholder="Ex: 202611" required>
      </div>

      <div class="form-group">
        <label for="nome" class="form-label">Nome Completo</label>
        <input type="text" id="nome" class="form-input" placeholder="Seu nome completo" required>
      </div>

      <div class="form-group">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" id="senha" class="form-input" placeholder="Mínimo 4 caracteres" required minlength="4">
      </div>

      <div class="form-group">
        <label for="confirmar-senha" class="form-label">Confirmar Senha</label>
        <input type="password" id="confirmar-senha" class="form-input" placeholder="Repita sua senha" required minlength="4">
      </div>

      <button type="submit" id="btn-cadastro" class="btn btn-accent" style="width: 100%; margin-top: 0.5rem;">
        Concluir Cadastro
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      Já possui uma conta? <a href="login.html" style="color: var(--primary-navy); font-weight: 700; text-decoration: none;">Faça Login</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
