<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Objetos — UNIP Achados e Perdidos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-layout">
    <main class="main-content">
      <div class="page-container">

        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Meus Objetos Cadastrados</h3>
              <p class="card-subtitle">Gerencie os pertences vinculados à sua conta</p>
            </div>
            <a href="objetos.html" class="btn btn-accent">+ Registrar Novo Objeto</a>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Objeto</th>
                  <th>Status</th>
                  <th>Detalhes</th>
                  <th>Local</th>
                  <th>Contato</th>
                  <th style="text-align: right;">Ações</th>
                </tr>
              </thead>
              <tbody id="my-objects-table-body">
                <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Carregando seus objetos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/meus-objetos.js"></script>
</body>
</html>
